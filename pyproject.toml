[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "venturi-engine"
version = "0.1.0"
description = "Architecture-independent safetensors loading powered by Siphon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "safetensors>=0.5"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
venturi = "venturi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["cuda: requires CUDA and the Siphon native loader"]
